---
# Install Steam from Debian's OWN apt archive (steam-installer, contrib/games) —
# unlike chrome/mega/trading this is not a vendor repo, just two prerequisites
# Debian doesn't enable by default: the `contrib` component and the `i386`
# foreign architecture (Steam's runtime is still largely 32-bit; steam-installer
# depends on the virtual `steam-libs-i386`, only resolvable once i386 is added).
# Root (become) throughout. OPT-IN: gated by `enable_steam` (default false) —
# it's a heavy, single-purpose (gaming) install.
#
# steam-installer itself is a thin wrapper: first run downloads the real Steam
# client from Valve and self-updates — that first-run + login stays manual/GUI,
# same as MEGAsync's sign-in.
#
# Steam is amd64-only (proprietary x86 client) — the role self-skips elsewhere,
# like chrome/trading.

- name: Detect the dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: _steam_arch
  changed_when: false

- name: "steam: no vendor build for this arch -> skip"
  ansible.builtin.debug:
    msg: "Steam ships amd64 only — skipping on {{ _steam_arch.stdout }}."
  when: _steam_arch.stdout != 'amd64'

- name: Install Steam
  when: _steam_arch.stdout == 'amd64'
  block:
    - name: Check current dpkg foreign architectures
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: _steam_foreign_arches
      changed_when: false

    - name: Enable the i386 architecture (Steam's 32-bit runtime libs)
      ansible.builtin.command: dpkg --add-architecture i386
      become: true
      when: "'i386' not in _steam_foreign_arches.stdout_lines"

    - name: Detect the Debian release codename
      ansible.builtin.shell: . /etc/os-release && printf '%s' "$VERSION_CODENAME"
      register: _steam_codename
      changed_when: false

    - name: Enable contrib (steam-installer lives in contrib/games)
      # A dedicated .sources file rather than editing the distro's own
      # sources.list — same shape as the nvidia role's contrib/non-free enable.
      ansible.builtin.deb822_repository:
        name: hestia-steam
        types: [deb]
        uris: "{{ steam_mirror_uri }}"
        suites: "{{ _steam_codename.stdout }}"
        components: [contrib]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present
      become: true

    - name: Install Steam (refresh the cache so i386 + contrib are seen)
      ansible.builtin.apt:
        name: "{{ steam_packages }}"
        state: present
        update_cache: true
      become: true

    - name: Gather installed package facts (NVIDIA GLX-alternative detection below)
      ansible.builtin.package_facts:

    - name: Also fetch NVIDIA's 32-bit GL libraries (only a Recommends of nvidia-driver-libs, so cross-arch)
      # Debian's proprietary driver ships real 32-bit GL too (unlike Ubuntu's,
      # this isn't a stub) — nvidia-driver-libs Recommends nvidia-driver-libs:i386
      # for exactly this. But that Recommends is only resolvable once i386 is a
      # known dpkg architecture, which it wasn't when the nvidia role first ran —
      # so on a host with an existing NVIDIA install it never got pulled. Install
      # it explicitly now that i386 is enabled (reusing the cache the Steam
      # install above just refreshed), so 32-bit apps get the same
      # NVIDIA-accelerated GL as the 64-bit side instead of a Mesa/llvmpipe
      # software fallback.
      ansible.builtin.apt:
        name: nvidia-driver-libs:i386
        state: present
      become: true
      when: "'glx-alternative-nvidia' in ansible_facts.packages"

    - name: Is the 32-bit GLX alternative already registered?
      ansible.builtin.stat:
        path: /usr/lib/i386-linux-gnu/libGL.so.1
      register: _steam_i386_libgl

    - name: Re-register the GLX alternative for i386 (glx-alternative-mesa/-nvidia missed it)
      # glx-alternative-mesa and glx-alternative-nvidia are Multi-Arch:foreign
      # singletons (ONE amd64 copy serves every arch) whose postinst scans
      # `dpkg --print-foreign-architectures` and registers an update-alternatives
      # --slave link per arch it finds a library file for — but only for
      # architectures that existed AT THAT CONFIGURE TIME. i386 didn't exist yet
      # (added above, this same run), so neither package created an i386 slave;
      # the currently-ACTIVE alternative (glx-alternative-nvidia, if an NVIDIA
      # host) still has no i386 entry at all, so /usr/lib/i386-linux-gnu/libGL.so.1
      # stays diverted-away-with-nothing-to-replace-it — Steam's "missing 32-bit
      # libGL.so.1" warning. Forcing both packages to reconfigure re-runs that
      # scan now that i386 libs exist, filling in the slave (mesa always; nvidia
      # too, and it takes the active/highest-priority slot back, when installed —
      # matching the already-selected 64-bit provider). dpkg-reconfigure re-runs
      # postinst `configure` directly, no debconf template needed, no network.
      ansible.builtin.command:
        cmd: "dpkg-reconfigure {{ item }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      become: true
      loop: >-
        {{ ['glx-alternative-mesa']
           + (['glx-alternative-nvidia'] if 'glx-alternative-nvidia' in ansible_facts.packages else []) }}
      when: not _steam_i386_libgl.stat.exists

    - name: Ensure ~/.local/bin and ~/.local/share/applications exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ target_home }}/.local/bin"
        - "{{ target_home }}/.local/share/applications"

    - name: Force Steam through XWayland (terminal launches)
      # Steam's native-Wayland client backend is unstable on wlroots — on this host
      # it corrupted XWayland override-redirect surfaces (menus/cursor) and CRASHED
      # sway outright resizing a tiled window alongside it (see CLAUDE.md's steam
      # gotcha section). Forcing XWayland (XDG_SESSION_TYPE=x11, scoped to just this
      # process) sidesteps Steam's own backend entirely rather than fighting it — the
      # compositor-wide WLR_RENDERER=vulkan mitigation tried first made XWayland
      # surfaces WORSE and was reverted (system/sway-session/start-sway.j2). No
      # `become` — this writes into the invoking user's own home, not root's.
      ansible.builtin.copy:
        src: steam-x11-wrapper.sh
        dest: "{{ target_home }}/.local/bin/steam"
        mode: "0755"

    - name: Force Steam through XWayland (desktop-launcher / wofi launches)
      # Same fix as the wrapper above, for launches via a .desktop entry (wofi drun,
      # any app grid) rather than a terminal — those exec the Exec= path directly,
      # not through $PATH, so the wrapper script alone doesn't cover them. A
      # user-level override at this exact XDG path takes precedence over
      # steam-installer's system one (/usr/share/applications/steam.desktop).
      # CAVEAT: if the real Valve client ever re-registers its OWN desktop entry at
      # this same user-level path (some Steam builds do, via `xdg-desktop-menu
      # install`), it will silently overwrite this file and undo the override — the
      # terminal wrapper above is unaffected either way; re-run `--tags steam` to
      # reassert this one if wofi launches start misbehaving again.
      ansible.builtin.copy:
        src: steam-x11.desktop
        dest: "{{ target_home }}/.local/share/applications/steam.desktop"
        mode: "0644"

    - name: First launch downloads + updates the real Steam client (manual)
      ansible.builtin.debug:
        msg: >-
          steam-installer is a bootstrap wrapper — launch `steam` once from a
          real desktop session to fetch the current Valve client and sign in.
          Steam is forced through XWayland (see the role's launcher-override
          tasks above); if the storefront/library UI still flickers, disable
          "Enable GPU accelerated rendering in web views" in Steam's own
          Settings > Interface — a known NVIDIA+Wayland CEF bug, not fixable
          from the compositor side (no permanent upstream fix as of 2026-08).
