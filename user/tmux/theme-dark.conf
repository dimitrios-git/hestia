# GENERATED by themes/hestia/render.py from palette.yml v0.11.0 + scopes.yml — do not edit; edit the sources and re-render
# tmux colours — dark (see .tmux.conf: source-file -q theme.conf)
#
# Roles used: surface #262626, border #3a3a3a, text #e0e0e0, dim #8c8c8c,
# muted #adadad, accent #7c3aed, accent_fg #ffffff.

# Overall bar: raised surface, primary text.
set -g status-style "bg=#262626,fg=#e0e0e0"

# Session name — accent-filled chip, mirrors the waybar accent modules.
set -g status-left-length 30
set -g status-left "#[fg=#ffffff,bg=#7c3aed,bold] #S #[fg=#e0e0e0,bg=#262626,nobold]"

# Date/time, muted (secondary — you rarely need the date, seconds don't matter here).
set -g status-right-length 60
set -g status-right "#[fg=#adadad,bg=#262626] %Y-%m-%d #[fg=#e0e0e0,bg=#262626,bold] %H:%M "

# Window list: active window gets the same accent fill as the session chip
# (matches kitty's "active-tab uses the violet accent" treatment).
setw -g window-status-format         "#[fg=#adadad,bg=#262626] #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bg=#7c3aed,bold] #I:#W "

# Pane borders: idle = border grey, active = accent (same idle/active split as
# swaylock's ring states).
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#7c3aed"

# Command prompt / messages (prefix + :), and copy-mode's visual selection.
set -g message-style "fg=#ffffff,bg=#7c3aed,bold"
set -g message-command-style "fg=#ffffff,bg=#7c3aed"
set -g mode-style "fg=#ffffff,bg=#7c3aed"

# Clock-mode (prefix + t)
set -g clock-mode-colour "#7c3aed"
