---
# Pinned Android Studio release — no apt package, no vendor apt repo (Google ships
# this as a plain downloadable tarball only), so it is pinned + sha256-verified the
# same way gtk_theme pins adw-gtk3 and openrgb pins its .deb. The checksum below was
# NOT copied from a webpage — the archive was downloaded and `sha256sum`'d directly
# against the value developer.android.com/studio published, 2026-08-14.
android_studio_version: "2026.1.3.8"     # the ide-zips path segment (Quail 3 Patch 1)
android_studio_label: "quail3-patch1"    # the human-readable slug in the filename
android_studio_url: "https://edgedl.me.gvt1.com/android/studio/ide-zips/{{ android_studio_version }}/android-studio-{{ android_studio_label }}-linux.tar.gz"
android_studio_sha256: "5bd5ee5d6e747b13f82fba3241380bd358cc2f4a847815c8e860757df13dc35f"

# The human added to the `kvm` group for accelerated emulation. Unlike `docker`,
# `kvm` group membership is NOT root-equivalent (it only grants access to
# /dev/kvm), so — unlike docker_admin_user — there is no reason to exclude the
# `claude` agent user from this var's default; it simply isn't relevant to claude,
# which never runs this role for itself.
android_dev_user: "{{ target_user }}"

