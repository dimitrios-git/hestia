---
# Install Microsoft Edge (microsoft-edge-stable) from Microsoft's own signed apt
# repo — it is NOT in Debian apt, same shape as `chrome`/`firefoxpwa`: add the
# signing key + a sources file, then apt-install. Root (become).
#
# Was previously installed by hand outside Ansible; this role brings it under
# management (2026-08-10) alongside the XWayland fix below, discovered while
# chasing the same NVIDIA/wlroots flicker family as the `steam`/`video_compare`
# roles.
#
# Edge is amd64-ONLY — Microsoft ships no arm64/i386 Linux build — so the role
# self-skips on other arches (like `chrome`/`trading`/`steam`).

- name: Detect CPU architecture
  ansible.builtin.command: uname -m
  register: _edge_arch
  changed_when: false

- name: "edge: no vendor build for this arch -> skip"
  ansible.builtin.debug:
    msg: "Microsoft Edge ships amd64 only — skipping on {{ _edge_arch.stdout }}."
  when: _edge_arch.stdout != 'x86_64'

- name: Install Microsoft Edge from the vendor apt repo
  when: _edge_arch.stdout == 'x86_64'
  block:
    - name: Install the Microsoft apt signing key (armored)
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /usr/share/keyrings/microsoft-edge.asc
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Add the Microsoft Edge apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/microsoft-edge.list
        content: "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.asc] https://packages.microsoft.com/repos/edge stable main\n"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Install microsoft-edge-stable (refresh the cache so the new repo is seen)
      ansible.builtin.apt:
        name: microsoft-edge-stable
        state: present
        update_cache: true
      become: true

    - name: Ensure ~/.local/bin and ~/.local/share/applications exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ target_home }}/.local/bin"
        - "{{ target_home }}/.local/share/applications"

    - name: Force Edge through XWayland (terminal launches)
      # See CLAUDE.md's Chromium-family XWayland gotcha + the wrapper script's own
      # comment for the full story (hover/repaint flicker on the native-Wayland
      # Ozone backend, live-confirmed fixed by --ozone-platform=x11). No `become`
      # — this writes into the invoking user's own home, not root's.
      ansible.builtin.copy:
        src: microsoft-edge-x11-wrapper.sh
        dest: "{{ target_home }}/.local/bin/microsoft-edge"
        mode: "0755"

    - name: Force Edge through XWayland (desktop-launcher / wofi launches)
      # Same fix as the wrapper above, for launches via a .desktop entry rather
      # than a terminal — those exec the Exec= path directly, not through $PATH.
      # A user-level override at this exact XDG path takes precedence over the
      # vendor package's system one (/usr/share/applications/microsoft-edge.desktop).
      # CAVEAT (same as the `steam` role): if a future Edge package version ever
      # re-registers its own desktop entry at this same user-level path, it will
      # silently overwrite this file — re-run `--tags edge` to reassert it.
      ansible.builtin.copy:
        src: microsoft-edge-x11.desktop
        dest: "{{ target_home }}/.local/share/applications/microsoft-edge.desktop"
        mode: "0644"
