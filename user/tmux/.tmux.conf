# hestia tmux config — terminal-multiplexer evaluation WINNER
# (enable_multiplexers; verdict + rationale in docs/roadmap.md "Multiplexer" +
# showcase/multiplexer.md — screen was trialled and dropped, zellij trialled
# and kept as a themed runner-up).

# True colour, so alacritty/kitty (TERM=alacritty/xterm-kitty outside tmux) render correctly inside.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Colours: GENERATED theme-{dark,light}.conf pair (themes/hestia/render.py from
# palette.yml — docs/theming.md), symlinked by the theme_variant to
# ~/.config/tmux/theme.conf. Edit palette.yml + re-render, not the fragment.
source-file -q ~/.config/tmux/theme.conf

# Snappy vim <Esc> handling (tmux's default 500ms delay makes vi insert-mode
# exits feel laggy).
set -sg escape-time 10

# Mouse: click to select pane/window, drag to resize, wheel to scroll.
set -g mouse on

# vi-style copy mode (matches bash `set -o vi` / vim across the rest of hestia).
setw -g mode-keys vi

# 1-indexed windows/panes (0 is an awkward reach on the keyboard's number row).
set -g base-index 1
setw -g pane-base-index 1

# Scrollback depth.
set -g history-limit 10000

# Split panes in the current pane's working directory; keep the original keys too.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style pane navigation, additive to the default arrow-key binds.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config on the fly.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- Plugins (TPM) ---------------------------------------------------------
# Session persistence across restarts/reboots — tmux-resurrect saves/restores
# sessions+panes+working-dirs, tmux-continuum auto-saves every 15 min and
# auto-restores on tmux start. Like vim-plug, TPM is deliberately NOT
# Ansible-managed: a one-time manual bootstrap, then `prefix + I` to install.
#
# Install TPM if missing:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then, inside tmux: prefix + I (capital i) to fetch the plugins below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
