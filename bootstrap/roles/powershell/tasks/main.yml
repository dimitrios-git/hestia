---
# Install PowerShell (pwsh) the way Microsoft documents for Debian
# (learn.microsoft.com/powershell/scripting/install/install-debian): register
# the Microsoft package repository (PMC) via Microsoft's own
# packages-microsoft-prod.deb config package, then apt-install `powershell`
# from it. This mirrors their published steps exactly (download the repo/key
# config .deb, install it, refresh, apt-get install powershell) rather than
# hand-rolling a sources.list.d entry like `chrome`/`edge`/`mega` do — PMC's
# config package is the vendor's own supported registration path here.
#
# amd64-only (like chrome/edge/steam/trading) — self-skips elsewhere.
# Root (become) for the repo registration + package install.
#
# Microsoft's .deb ships NO .desktop entry or icon at all (verified via
# `dpkg -L powershell` — just the /opt payload + a /usr/bin/pwsh symlink), so
# after install the role also drops a wofi/app-grid launcher (no root): the
# official PowerShell logo (assets/powershell_128.svg from the upstream
# PowerShell/PowerShell repo, MIT-licensed) into the user's hicolor icon
# theme, and a .desktop entry that opens pwsh in the default terminal
# ($term alacritty in sway config) — same shape as the $mod+m/$mod+c
# alacritty -e launches in user/sway/config.

- name: Detect CPU architecture
  ansible.builtin.command: uname -m
  register: _powershell_arch
  changed_when: false

- name: "powershell: no vendor build for this arch -> skip"
  ansible.builtin.debug:
    msg: "PowerShell's Debian PMC package targets amd64 — skipping on {{ _powershell_arch.stdout }}."
  when: _powershell_arch.stdout != 'x86_64'

- name: Install PowerShell from the Microsoft package repository (PMC)
  when: _powershell_arch.stdout == 'x86_64'
  block:
    - name: Detect the Debian VERSION_ID (PMC's config package is versioned per-release)
      ansible.builtin.shell: . /etc/os-release && echo "$VERSION_ID"
      register: _powershell_debver
      changed_when: false

    - name: Download Microsoft's repository registration package (packages-microsoft-prod.deb)
      ansible.builtin.get_url:
        url: "https://packages.microsoft.com/config/debian/{{ _powershell_debver.stdout }}/packages-microsoft-prod.deb"
        dest: /tmp/packages-microsoft-prod.deb
        mode: "0644"

    - name: Register the Microsoft package repository + signing key
      ansible.builtin.apt:
        deb: /tmp/packages-microsoft-prod.deb
      become: true

    - name: Remove the downloaded registration package
      ansible.builtin.file:
        path: /tmp/packages-microsoft-prod.deb
        state: absent

    - name: Install powershell (refresh the cache so the new repo is seen)
      ansible.builtin.apt:
        name: powershell
        state: present
        update_cache: true
      become: true

    - name: Ensure the icon + applications dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ target_home }}/.local/share/icons/hicolor/scalable/apps"
        - "{{ target_home }}/.local/share/applications"

    - name: Install the PowerShell icon (upstream MIT-licensed SVG logo)
      ansible.builtin.copy:
        src: powershell.svg
        dest: "{{ target_home }}/.local/share/icons/hicolor/scalable/apps/powershell.svg"
        mode: "0644"

    - name: Install the PowerShell wofi/app-grid launcher entry
      ansible.builtin.copy:
        src: powershell.desktop
        dest: "{{ target_home }}/.local/share/applications/powershell.desktop"
        mode: "0644"

    # Best-effort, same idiom as the yaru_icons role: GTK/wofi can resolve the
    # icon by scanning the hicolor dir even without a cache, this just speeds
    # the lookup. Skip cleanly if gtk-update-icon-cache isn't installed or the
    # user-level hicolor dir has no index.theme to refresh against.
    - name: Refresh the icon cache
      ansible.builtin.command:
        cmd: "gtk-update-icon-cache -qtf {{ target_home }}/.local/share/icons/hicolor"
      changed_when: true
      failed_when: false
