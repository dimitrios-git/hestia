# hestia tmux theme — LIGHT variant
#
# Hand-authored per docs/theming.md's lightweight process (palette values pulled
# from themes/hestia/palette.yml by hand — tmux is not yet a render.py target,
# see docs/theming.md's tmux row). Bootstrap symlinks the theme_variant one of
# this pair to ~/.config/tmux/theme.conf; user/tmux/.tmux.conf source-files it.
# Edit palette.yml first if a role's hex value ever moves, then mirror it here.
#
# Roles used: surface #e4e4e4, border #c6c6c6, text #1a1a1a, dim #626262,
# muted #4e4e4e, accent #7c3aed (same both variants), accent_fg #ffffff.

# Overall bar: raised surface, primary text.
set -g status-style "bg=#e4e4e4,fg=#1a1a1a"

# Session name — accent-filled chip, mirrors the waybar accent modules.
set -g status-left-length 30
set -g status-left "#[fg=#ffffff,bg=#7c3aed,bold] #S #[fg=#1a1a1a,bg=#e4e4e4,nobold]"

# Date/time, muted (secondary — you rarely need the date, seconds don't matter here).
set -g status-right-length 60
set -g status-right "#[fg=#4e4e4e,bg=#e4e4e4] %Y-%m-%d #[fg=#1a1a1a,bg=#e4e4e4,bold] %H:%M "

# Window list: active window gets the same accent fill as the session chip
# (matches kitty's "active-tab uses the violet accent" treatment).
setw -g window-status-format         "#[fg=#4e4e4e,bg=#e4e4e4] #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bg=#7c3aed,bold] #I:#W "

# Pane borders: idle = border grey, active = accent (same idle/active split as
# swaylock's ring states).
set -g pane-border-style "fg=#c6c6c6"
set -g pane-active-border-style "fg=#7c3aed"

# Command prompt / messages (prefix + :), and copy-mode's visual selection.
set -g message-style "fg=#ffffff,bg=#7c3aed,bold"
set -g message-command-style "fg=#ffffff,bg=#7c3aed"
set -g mode-style "fg=#ffffff,bg=#7c3aed"

# Clock-mode (prefix + t)
set -g clock-mode-colour "#7c3aed"
